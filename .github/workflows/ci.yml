# 需要 PostgreSQL 的测试用 Testcontainers 启动 pgvector/pgvector:pg18（GitHub 的 ubuntu 运行器自带 Docker）。
# CI=true 时没有 Docker 会直接失败，不会悄悄跳过。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 只读令牌：CI 不需要写仓库
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint、类型检查、单元测试、构建与冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: 生产构建产物启动冒烟（无 @dowel/source 条件）
        run: |
          set -euo pipefail
          SMOKE_DB="$(mktemp -u /tmp/dowel-smoke-XXXXXX.db)"
          PORT=4699 DOWEL_DB="$SMOKE_DB" DOWEL_SECRET="ci-smoke-secret-0123456789" \
            DOWEL_DRIFT_INTERVAL_MINUTES=0 node apps/server/dist/main.js &
          SERVER_PID=$!
          cleanup() {
            if kill -0 "$SERVER_PID" 2>/dev/null; then
              kill -TERM "$SERVER_PID" 2>/dev/null || true
              wait "$SERVER_PID" || true
            fi
            rm -f "$SMOKE_DB" "${SMOKE_DB}-wal" "${SMOKE_DB}-shm"
          }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              wait "$SERVER_PID"
            fi
            if curl -fsS --max-time 5 http://127.0.0.1:4699/api/instance >/dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done
          INSTANCE_JSON="$(curl -fsS --max-time 5 http://127.0.0.1:4699/api/instance)"
          echo "GET /api/instance -> $INSTANCE_JSON"
          grep -q '"needsSetup":true' <<<"$INSTANCE_JSON"
          INDEX_HTML="$(curl -fsS --max-time 5 http://127.0.0.1:4699/)"
          grep -qi '<!doctype html>' <<<"$INDEX_HTML"
          grep -q 'id="root"' <<<"$INDEX_HTML"
          kill -TERM "$SERVER_PID"
          wait "$SERVER_PID"

  pg-matrix:
    name: PG 多版本矩阵（PG ${{ matrix.pg }}）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pg: ['15', '16', '17', '18', '19']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run packages/engines/test/roundtrip.test.ts packages/engines/test/pagila.test.ts packages/verifier/test/pg-matrix.test.ts
        env:
          DOWEL_PG_IMAGE: pgvector/pgvector:pg${{ matrix.pg }}

  heavy:
    name: 随机闭环测试（5000 例）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run packages/verifier/test/random.test.ts packages/engines/test/naming.test.ts
        env:
          RUNS: '5000'
          # 整个属性测试（含缩小反例）的总时限：5000 例正常 8～10 分钟，留到 30 分钟
          TIME_LIMIT: '1800000'

  e2e:
    name: 端到端测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # 截图对比测试需要中文字体（与本地生成基准图时一致）
      - run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: pnpm e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

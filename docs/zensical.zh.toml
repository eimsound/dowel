[project]
site_name = "Dowel 文档"
site_description = "开源、可自托管、支持多人实时协作的数据库 schema 建模与迁移平台"
site_url = "https://eimsound.github.io/dowel/zh/"
repo_url = "https://github.com/eimsound/dowel"
repo_name = "eimsound/dowel"
edit_uri = "edit/main/docs/zh/"
docs_dir = "zh"
site_dir = "site/zh"

nav = [
  { "首页" = "index.md" },
  { "快速开始" = [
    { "上手指南" = "getting-started.md" },
    { "部署与配置" = "deployment.md" },
    { "账户、OIDC 与权限" = "accounts-and-access.md" },
  ] },
  { "建模与版本" = [
    { "建模、版本与画布历史" = "modeling.md" },
    { "多方言与版本支持" = "dialects.md" },
    { "接手现有项目与灾难恢复" = "takeover.md" },
  ] },
  { "执行与治理" = [
    { "执行迁移、回滚与漂移" = "execution.md" },
    { "执行策略与执行者" = "execution-policy.md" },
    { "执行申请与审批" = "approvals.md" },
    { "组级 Webhook" = "webhooks.md" },
  ] },
  { "CI 与参考" = [
    { "CI HTTP API" = "api.md" },
    { "AI 编程助手（MCP）" = "mcp.md" },
    { "CI 流水线集成" = "ci-action.md" },
    { "术语表" = "glossary.md" },
  ] },
]

[project.theme]
language = "zh"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "切换明暗主题"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "切换为深色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "跟随系统主题"

[[project.extra.alternate]]
name = "English"
link = "/dowel/"
lang = "en"

[[project.extra.alternate]]
name = "简体中文"
link = "/dowel/zh/"
lang = "zh"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true

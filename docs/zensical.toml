[project]
site_name = "Dowel Docs"
site_description = "Open-source, self-hosted, real-time collaborative database schema modeling and migration platform"
site_url = "https://eimsound.github.io/dowel/"
repo_url = "https://github.com/eimsound/dowel"
repo_name = "eimsound/dowel"
edit_uri = "edit/main/docs/en/"
docs_dir = "en"
site_dir = "site"

nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    { "Getting started" = "getting-started.md" },
    { "Deployment and configuration" = "deployment.md" },
    { "Accounts, OIDC, and access" = "accounts-and-access.md" },
  ] },
  { "Modeling and versions" = [
    { "Modeling, versions, and canvas history" = "modeling.md" },
    { "Dialects and version support" = "dialects.md" },
    { "Takeover and disaster recovery" = "takeover.md" },
  ] },
  { "Execution and governance" = [
    { "Execution, rollback, and drift" = "execution.md" },
    { "Execution policy and executors" = "execution-policy.md" },
    { "Execution requests and approvals" = "approvals.md" },
    { "Group webhooks" = "webhooks.md" },
  ] },
  { "CI and reference" = [
    { "CI HTTP API" = "api.md" },
    { "CI pipeline integration" = "ci-action.md" },
    { "Glossary" = "glossary.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.alternate]]
name = "English"
link = "/dowel/"
lang = "en"

[[project.extra.alternate]]
name = "简体中文"
link = "/dowel/zh/"
lang = "zh"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
